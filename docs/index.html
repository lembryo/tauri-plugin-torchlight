<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>tauri-plugin-torchlight — Torch / flashlight plugin for Tauri v2 (Android &amp; iOS)</title>
    <meta
        content="tauri-plugin-torchlight — control the smartphone torch from a Tauri v2 app on Android and iOS: on/off, brightness, availability and state queries, and system torch change events. Rust + TypeScript, MIT / Apache-2.0. Tauri v2 用のスマートフォン ライト（トーチ）制御プラグイン。"
        name="description"/>
    <meta content="index, follow, max-image-preview:large" name="robots"/>
    <meta content="#f59e0b" name="theme-color"/>

    <link href="https://lembryo.github.io/tauri-plugin-torchlight/" rel="canonical"/>
    <link href="https://lembryo.github.io/tauri-plugin-torchlight/en/" hreflang="en" rel="alternate"/>
    <link href="https://lembryo.github.io/tauri-plugin-torchlight/ja/" hreflang="ja" rel="alternate"/>
    <link href="https://lembryo.github.io/tauri-plugin-torchlight/" hreflang="x-default" rel="alternate"/>

    <meta content="website" property="og:type"/>
    <meta content="tauri-plugin-torchlight" property="og:site_name"/>
    <meta content="tauri-plugin-torchlight — Torch plugin for Tauri v2" property="og:title"/>
    <meta
        content="Control the smartphone torch from Tauri v2 on Android and iOS: on/off, brightness, availability and state, plus system change events."
        property="og:description"/>
    <meta content="https://lembryo.github.io/tauri-plugin-torchlight/" property="og:url"/>

    <link href="./favicon.svg" rel="icon" type="image/svg+xml"/>
    <script>
        // 言語を選んで /ja または /en へ振り分ける。
        // 1) 以前の選択（localStorage） 2) ブラウザ言語 3) 既定は英語
        (function () {
            var lang;
            try {
                lang = localStorage.getItem('torchlight-lang');
            } catch (e) {
            }
            if (lang !== 'ja' && lang !== 'en') {
                lang = (navigator.language || '').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
            }
            location.replace(lang === 'ja' ? './ja/' : './en/');
        })();
    </script>
    <meta content="0; url=./en/" http-equiv="refresh"/>
</head>
<body>
<p style="font-family:sans-serif;padding:24px">
    Redirecting… / 移動中… &nbsp;
    <a href="./en/">English</a> · <a href="./ja/">日本語</a>
</p>
</body>
</html>
