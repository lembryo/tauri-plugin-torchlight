name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Nothing in this workflow uses GITHUB_TOKEN; publishing is authenticated with
# CARGO_REGISTRY_TOKEN / NODE_AUTH_TOKEN instead.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Building the desktop target of `tauri` needs the GTK/WebKit system
      # libraries (glib-2.0 and friends) to be present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The crate version and the npm package version are published as a pair,
      # so they must always be bumped together.
      - name: Check Cargo.toml and package.json versions agree
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          npm_version=$(node -p "require('./package.json').version")
          echo "Cargo.toml:   $cargo_version"
          echo "package.json: $npm_version"
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::Version mismatch: Cargo.toml is $cargo_version but package.json is $npm_version. Bump both together."
            exit 1
          fi

      # `cargo fmt --check` is intentionally not run: this repository is not
      # rustfmt-formatted.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Install npm dependencies
        run: npm ci

      - name: npm run build
        run: npm run build

  # npm is published first because it is the reversible half of the release
  # (npm allows unpublish within 72h, while a crates.io yank does not
  # un-publish). The crate job only runs once npm has succeeded.
  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name='${{ steps.pkg.outputs.name }}'
          version='${{ steps.pkg.outputs.version }}'
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # A 403 on publish is almost always a token problem rather than a package
      # problem, so check the credentials separately to make the cause obvious.
      - name: Verify npm credentials
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN could not be authenticated: $who"
            echo "::error::Use a granular token with read+write access to ALL packages (a new package cannot be created by a token scoped to selected packages), or a classic Automation token."
            exit 1
          fi
          echo "Authenticated to npm as: $who"

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: npm publish
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-crate:
    name: Publish to crates.io
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies the packaged crate by building it. On Linux that
      # compiles the desktop target of `tauri`, which needs the GTK/WebKit system
      # libraries (glib-2.0 and friends) to be present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Read crate name and version
        id: crate
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          name=$(printf '%s' "$metadata" | jq -r '.packages[0].name')
          version=$(printf '%s' "$metadata" | jq -r '.packages[0].version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # An unknown state must never mean "publish": only an explicit 404 (the
      # crate does not exist yet) or a parsed 200 response is trusted. Anything
      # else - 5xx, rate limiting, DNS failure - fails the step hard.
      - name: Check whether the version is already published
        id: check
        run: |
          set -euo pipefail
          name='${{ steps.crate.outputs.name }}'
          version='${{ steps.crate.outputs.version }}'
          status=$(curl -sS -w '%{http_code}' -o body.json \
            --retry 3 --retry-delay 2 \
            -H 'User-Agent: ${{ github.repository }} release workflow' \
            "https://crates.io/api/v1/crates/$name/versions")
          echo "crates.io responded with HTTP $status"
          case "$status" in
            404)
              echo "$name is not on crates.io yet; publishing."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              published=$(jq -r --arg v "$version" '[.versions[]? | select(.num == $v)] | length' body.json)
              published=${published:-0}
              if [ "$published" -gt 0 ]; then
                echo "$name $version is already on crates.io; skipping publish."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "$name $version is not on crates.io; publishing."
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Unexpected HTTP $status from crates.io while checking whether $name $version is published. Refusing to publish from an unknown state."
              cat body.json || true
              exit 1
              ;;
          esac

      - name: cargo publish
        if: steps.check.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish
