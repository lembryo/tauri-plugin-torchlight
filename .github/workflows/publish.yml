name: publish

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies the packaged crate by building it. On Linux that
      # compiles the desktop target of `tauri`, which needs the GTK/WebKit system
      # libraries (glib-2.0 and friends) to be present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Read crate name and version
        id: crate
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        run: |
          name='${{ steps.crate.outputs.name }}'
          version='${{ steps.crate.outputs.version }}'
          published=$(curl -sSf \
            -H 'User-Agent: ${{ github.repository }} release workflow' \
            "https://crates.io/api/v1/crates/$name/versions" \
            | jq -r --arg v "$version" '[.versions[]? | select(.num == $v)] | length')
          if [ "$published" -gt 0 ]; then
            echo "$name $version is already on crates.io; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        if: steps.check.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name='${{ steps.pkg.outputs.name }}'
          version='${{ steps.pkg.outputs.version }}'
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # A 403 on publish is almost always a token problem rather than a package
      # problem, so check the credentials separately to make the cause obvious.
      - name: Verify npm credentials
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN could not be authenticated: $who"
            echo "::error::Use a granular token with read+write access to ALL packages (a new package cannot be created by a token scoped to selected packages), or a classic Automation token."
            exit 1
          fi
          echo "Authenticated to npm as: $who"

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: npm publish
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
