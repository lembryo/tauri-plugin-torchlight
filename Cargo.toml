[package]
name = "tauri-plugin-torchlight"
version = "1.0.11"
authors = ["mao <mao.lembryo@gmail.com>"]
description = "Tauri v2 plugin to control the smartphone torch on Android and iOS: on/off, brightness, availability and state queries, and system torch change events."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lembryo/tauri-plugin-torchlight.git"
homepage = "https://lembryo.github.io/tauri-plugin-torchlight/"
documentation = "https://docs.rs/tauri-plugin-torchlight"
keywords = ["tauri", "plugin", "torch", "flashlight", "mobile"]
categories = ["api-bindings", "hardware-support"]
rust-version = "1.85.0"
exclude = ["/examples", "/docs", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-torchlight"

[dependencies]
tauri = { version = "2" }
serde = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
